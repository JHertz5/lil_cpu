name: sim

on:
  workflow_call:

jobs:
  vsg_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up tools
        run: make _set_up_tools

      - name: Set up NVC
        uses: nickg/setup-nvc@v1
        with:
          version: latest

      - name: Run the self-checking testbenches
        run: make test
