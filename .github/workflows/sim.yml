name: sim

on:
  workflow_call:

jobs:
  vsg_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Set up tools
        run: make _set_up_tools

      - name: Set up NVC
        uses: nickg/setup-nvc@v1
        with:
          version: latest

      - uses: VUnit/vunit_action@v0.1.0
        with:
          run_file: test/run.py
